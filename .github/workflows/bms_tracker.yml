name: BMS Ticket Tracker

on:
  schedule:
    - cron: '*/5 * * * *'  # GitHub minimum interval is 5 minutes
  workflow_dispatch:
  push:
    paths:
      - 'watches.json'

permissions:
  contents: write

concurrency:
  group: bms-tracker-state
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Start Userspace WARP Proxy (wgcf + wireproxy in 3s)
        run: |
          curl -fsSL https://github.com/ViRb3/wgcf/releases/download/v2.2.22/wgcf_2.2.22_linux_amd64 -o wgcf
          chmod +x wgcf
          ./wgcf register --accept-tos || true
          ./wgcf generate || true

          curl -fsSL https://github.com/pufferffish/wireproxy/releases/download/v1.0.9/wireproxy_linux_amd64.tar.gz | tar -xz
          chmod +x wireproxy

          cat >> wgcf-profile.conf << 'EOF_CONF'

          [Socks5]
          BindAddress = 127.0.0.1:40000
          EOF_CONF

          ./wireproxy -c wgcf-profile.conf &
          sleep 2

      - name: Run BMS Tracker
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PROXY_URL: 'socks5h://127.0.0.1:40000'
        run: python main.py

      - name: Save updated state (bms_state.json)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -f bms_state.json ]; then
            git add bms_state.json
            git diff --staged --quiet || git commit -m "chore: update bms_state.json [skip ci]"
            git pull --rebase origin main || true
            git push origin main || true
          fi
